<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Toro Sponsor</title>
  <link rel="stylesheet" href="style.css" />
</head>
  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyASi0J8nIYNk1x3KqzsPuTDQfBAxP1riV4",
  authDomain: "toro-sponsor.firebaseapp.com",
  projectId: "toro-sponsor",
  storageBucket: "toro-sponsor.firebasestorage.app",
  messagingSenderId: "380071282395",
  appId: "1:380071282395:web:71b1ec542fde866daf6efe"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.logout = async function() {
  try {
    await signOut(auth);
    window.location.href = "login.html";
  } catch (error) {
    alert("Error al cerrar sesión");
    console.error(error);
  }
};
</script>
  <body>
  <main class="section">
    <h1>Panel de Administrador</h1>
    <p>Bienvenido, Robert. Desde aquí controlarás Toro Sponsor.</p>

    <div class="grid">
      <div class="card">📌 Proyectos registrados: 0</div>
      <div class="card">🤝 Patrocinadores: 0</div>
      <div class="card">💰 Oportunidades activas: 0</div>
      <div class="card">📩 Mensajes recibidos: 0</div>
    </div>

    <h2>Acciones rápidas</h2>
    <div class="actions">
      <button class="btn primary">Ver patrocinadores</button>
      <button class="btn secondary">Ver proyectos</button>
      <button class="btn secondary" onclick="logout()">Cerrar sesión</button>   
    </div>
  </main>
  <script src="firebase-config.js"></script>
  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyASi0J8nIYNk1x3KqzsPuTDQfBAxP1riV4",
  authDomain: "toro-sponsor.firebaseapp.com",
  projectId: "toro-sponsor",
  storageBucket: "toro-sponsor.firebasestorage.app",
  messagingSenderId: "380071282395",
  appId: "1:380071282395:web:71b1ec542fde866daf6efe"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "login.html";
  }
});
</script>
</body>
</html>
