<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Toro Sponsor</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:#1c1c1c;
    padding:30px;
    border-radius:10px;
    width:320px;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
}

button{
    width:100%;
    padding:12px;
    background:gold;
    border:none;
    cursor:pointer;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
    <h2>Acceso Administrador</h2>

    <input type="email" id="email" placeholder="Correo electrónico">

    <input type="password" id="password" placeholder="Contraseña">

    <button onclick="login()">Entrar</button>

    <p id="msg"></p>
</div>

<script>
function login(){
    document.getElementById("msg").innerHTML =
    "Firebase se conectará en el siguiente paso";
}
</script>

</body>
</html>
