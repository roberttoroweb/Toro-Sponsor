<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Toro Sponsor</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:#1c1c1c;
    padding:30px;
    border-radius:10px;
    width:320px;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
}

button{
    width:100%;
    padding:12px;
    background:gold;
    border:none;
    cursor:pointer;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
    <h2>Acceso Administrador</h2>

    <input type="email" id="email" placeholder="Correo electrónico">

    <input type="password" id="password" placeholder="Contraseña">

    <button onclick="login()">Entrar</button>

    <p id="msg"></p>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyASi0J8nIYNk1x3KqzsPuTDQfBAxP1riV4",
  authDomain: "toro-sponsor.firebaseapp.com",
  projectId: "toro-sponsor",
  storageBucket: "toro-sponsor.firebasestorage.app",
  messagingSenderId: "380071282395",
  appId: "1:380071282395:web:71b1ec542fde866daf6efe"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = async function () {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    window.location.href = "admin.html";

  } catch (error) {

    document.getElementById("msg").innerHTML =
      "Correo o contraseña incorrectos";

  }
};

</script>
</body>
</html>
